alerts:
  - name: high_p95_latency
    severity: high
    condition: latency_p95 > 4000ms
    duration: 5m
    type: symptom-based
    channel: slack
    owner: platform-team
    runbook: docs/alerts.md#alert-1
  - name: elevated_error_rate
    severity: critical
    condition: error_rate_pct > 2
    duration: 3m
    type: symptom-based
    channel: slack
    owner: core-backend-team
    runbook: docs/alerts.md#alert-2
  - name: low_retrieval_success
    severity: warning
    condition: retrieval_success_rate_pct < 90
    duration: 10m
    type: symptom-based
    channel: slack
    owner: ai-engineer-team
    runbook: docs/alerts.md#alert-3